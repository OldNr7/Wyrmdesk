<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wyrmdesk Handbuch</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .pick { max-width: 560px; margin: 12vh auto; padding: 0 16px; text-align: center; }
    .pick h1 { font-size: 34px; margin-bottom: 4px; }
    .pick p { color: var(--muted); }
    .pick .cards a { text-decoration: none; color: var(--text); }
    .pick .card:hover { border-color: var(--gold); }
  </style>
  <script>
    // Straight to the browser's language; the links below stay for everyone else.
    try {
      if (!location.hash) location.replace((navigator.language || "").toLowerCase().startsWith("de") ? "de/" : "en/");
    } catch (e) {}
  </script>
</head>
<body>
  <div class="pick">
    <h1>Wyrmdesk</h1>
    <p>Handbuch · Handbook</p>
    <div class="cards">
      <a href="de/" class="card" hreflang="de"><b>Deutsch</b><span>Anleitung auf Deutsch</span></a>
      <a href="en/" class="card" hreflang="en"><b>English</b><span>Guide in English</span></a>
    </div>
  </div>
</body>
</html>
